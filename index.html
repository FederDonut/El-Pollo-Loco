<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/img/Favicon/Skizze.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Pollo Loco</title>
    
    <script src="/models/drawable-objekt.class.js"></script>
    <script src="/models/status-bar.class.js"></script>
    <script src="/models/movable-object.class.js"></script>
    <script src="/models/level.class.js"></script>
    <script src="/models/explosion.class.js"></script>
    <script src="/models/missile.class.js"></script>
   
    <script src="/models/chick-object.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="/models/endboss.class.js"></script>
    <script src="/models/clouds.class.js"></script>
    <script src="/models/background-object.class.js"></script>
    <script src="/models/bottle-object.class.js"></script>
    <script src="/models/coin-objects.class.js"></script>
    <script src="/models/character.class.js"></script>
    <script src="/models/keyboard.class.js"></script>
    <script src="/models/audio-controller.class.js"></script>
    
    
    
    <script src="/levels/level1.js"></script>
    <script src="/models/world.class.js"></script>
   
    <script src="/js/game.js"></script>
</head>
<body>
    <section class="startScreen" id="startScreen">
        <div class="startPosition">
            <button class="Start-Game btn" onclick="startGame()"></button>
        </div>
    </section>
    <section class="gameOverScreen d-none" id="gameOver">
        <div class="gameOverPosition"></div>
        <button class="Try-Again btn" onclick="tryAgain()"></button>
    </section>
    <section class="YouWon d-none" id="YouWon">
        <button class="btn winBtn" onclick="tryAgainAfterWin()"></button>
    </section>

    
    <h1>EL POLLO LOCO</h1>
    <section id="CanvasDocker" class="Canvas-Container">
        <canvas id="canvas" width="1720" height="780"></canvas>
        <div id="Canvas-Container" class="Canvas-Control">
            <div id="fullscreen" class="canvasBtn fullscreen d-none" onclick="fullScreen()"></div>
            <div id="sound-control" class="canvasBtn sound-control-audible d-none" onclick="muteSounds()"></div>
        </div>
        <div class="hud">
            <div class="hud-wrapper">
                <div class="hud-position">
                    <button id="goLeft" class="mobileBtn left"></button>
                    <button id="goRight" class="mobileBtn right"></button>
                </div>
                <div class="hud-position">
                    <button id="jump" class="mobileBtn up"></button>
                    <button id="attack" class="mobileBtn attack"></button>
                </div>
            </div>
        </div>
    </section>
    

    <section id="Game-Manual" class="Game-Manual">
        <div class="img-1">
            <div class="Item">
                <div class="Item-img bottle-img"></div>
                <div class="description"> = Ammunation</div>
            </div>
            <div class="Item">
                <div class="Item-img coin-img"></div>
                <div class="description"> = Coin </div>
            </div>
        </div>
        <div class="img-2"></div>
        <div class="img-3"></div>
    </section>
    
</body>
</html>
